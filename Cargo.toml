[package]
name = "anza-xtask"
version = "0.2.6"
authors = ["Anza Maintainers <maintainers@anza.xyz>"]
description = "Blockchain, Rebuilt for Scale"
repository = "https://github.com/anza-xyz/xtask"
homepage = "https://anza.xyz/"
license = "Apache-2.0"
edition = "2021"

# Prevents auto-detection of parent workspace (ie. git worktrees).
[workspace]

[features]
agave-unstable-api = []
dummy-for-ci-check = []
frozen-abi = []

[dependencies]
anyhow = "1.0.100"
askama = "0.16.1"
cargo_metadata = "0.23.1"
clap = { version = "4.5.57", features = ["derive"] }
env_logger = "0.11.8"
ignore = "0.4.25"
log = "0.4.28"
scopeguard = "1.2.0"
semver = "1.0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml_edit = { version = "0.25.13", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2.1.2"
pretty_assertions = "1.4.1"
scopeguard = "1.2.0"
serial_test = "4.0.1"
tempfile = "3.23.0"
